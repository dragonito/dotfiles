format = """
[](#1A1B26)\
$hostname\
$username\
[](bg:#24283B fg:#1A1B26)\
$directory\
[](fg:#24283B bg:#414868)\
$git_branch\
$git_status\
[](fg:#414868 bg:#E0AF68)\
$git_state\
$cmd_duration\
[](fg:#E0AF68 bg:#7AA2F7)\
$c$golang$rust$php$python\
[](fg:#7AA2F7 bg:#7DCFFF)\
$docker_context\
[](fg:#7DCFFF bg:#565F89)\
$time\
[ ](fg:#565F89)\
$line_break$character
"""

# Prompt should not hang forever; still generous enough for slow filesystems.
command_timeout = 2000 
# add_newline = false


[git_state]
style = "bg:#E0AF68 fg:#1A1B26"
format = '[ $state( $progress_current/$progress_total) ]($style)'


[hostname]
ssh_only = true
style = "bg:#1A1B26"
format = "[ $ssh_symbol$hostname ]($style)"


[username]
show_always = true
style_user = "bg:#1A1B26"
style_root = "bg:#1A1B26"
format = '[ ]($style)'


[directory]
style = "bg:#24283B"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true 
[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""


[git_branch]
symbol = ""
style = "bg:#414868"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#414868 fg:#C0CAF5"
format = "[$conflicted$stashed$deleted$renamed$modified$staged$untracked]($style)[$ahead_behind]($style)"

# Working tree flags (mit count)
conflicted = "[  ${count} ](bg:#414868 fg:#F7768E)"  # red-ish
stashed    = "[ 󰏗 ${count} ](bg:#414868 fg:#E0AF68)"  # yellow-ish
deleted    = "[  ${count} ](bg:#414868 fg:#F7768E)"
renamed    = "[  ${count} ](bg:#414868 fg:#7DCFFF)"
modified   = "[  ${count} ](bg:#414868 fg:#E0AF68)"
staged     = "[  ${count} ](bg:#414868 fg:#9ECE6A)"  # green-ish
untracked  = "[  ${count} ](bg:#414868 fg:#7AA2F7)"

# Ahead/behind/diverged (mit counts)
ahead      = "[ ⇡${count} ](bg:#414868 fg:#9ECE6A)"
behind     = "[ ⇣${count} ](bg:#414868 fg:#F7768E)"
diverged   = "[ ⇕⇡${ahead_count}⇣${behind_count} ](bg:#414868 fg:#E0AF68)"
up_to_date = "[ ✓ ](bg:#414868 fg:#9ECE6A)"

[golang]
symbol = ""
style = "bg:#7AA2F7 fg:#1A1B26"
format = '[ $symbol ($version) ]($style)'
detect_files = ["go.mod", "go.sum"]
detect_extensions = ["go"]

[rust]
symbol = ""
style = "bg:#7AA2F7 fg:#1A1B26"
format = '[ $symbol ($version) ]($style)'
detect_files = ["Cargo.toml", "Cargo.lock"]
detect_extensions = ["rs"]

[php]
symbol = ""
style = "bg:#7AA2F7 fg:#1A1B26"
format = '[ $symbol ]($style)'
detect_files = ["composer.json"]

[docker_context]
symbol = ""
style = "bg:#7DCFFF fg:#1A1B26"
format = '[ $symbol ]($style)'
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[time]
disabled = false
time_format = "%R"
style = "bg:#565F89"
format = '[ $time ]($style)'


[cmd_duration]
min_time = 2000
style = "bg:#E0AF68 fg:#1A1B26"
format = '[cmd took $duration ]($style)'

[character]
success_symbol = "[❯](bold #9ECE6A)"
error_symbol = "[❯](bold #F7768E)"

[python]
symbol = ""
style = "bg:#7AA2F7 fg:#1A1B26"
format = '[ $symbol ($version) ]($style)'
detect_files = [
  "pyproject.toml",
  "requirements.txt",
  "requirements-dev.txt",
  "Pipfile",
  "poetry.lock",
  "setup.py",
]
detect_extensions = ["py"]

